<title>Lịch Nhà Mình</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lịch Nhà Mình">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: bảng tin gia đình trên nền giấy kẻ ô; chọn người ở trên, thanh tab to ở đáy cho ngón tay bé */
:root{
  --bg:#EDF2F7; --grid:rgba(44,90,150,.07); --paper:#FFFFFF; --paper2:#F5F8FC;
  --ink:#1C2840; --muted:#55647C; --line:#D2DCE8; --scrim:rgba(20,28,45,.55);
  --sun:#FFC83D; --sun-ink:#3A2C00; --on-color:#FFFFFF;
  --c-hoc:#2C6BD3; --t-hoc:#E4EEFC;
  --c-hocthem:#7546CC; --t-hocthem:#EFE8FB;
  --c-kiemtra:#D2402F; --t-kiemtra:#FCE7E4;
  --c-nghi:#23915A; --t-nghi:#E1F4E9;
  --c-viec:#B87200; --t-viec:#FDF1DC;
  --c-nhac:#0B8796; --t-nhac:#DDF3F5;
  --c-tuhoc:#B8368C; --t-tuhoc:#FBE6F3;
  --c-choi:#4D7C0F; --t-choi:#EAF4D9; --c-sinhhoat:#566690; --t-sinhhoat:#E7EBF3;
  --c-sn:#C2255C; --t-sn:#FDE7EF; --c-le:#C2410C; --t-le:#FDEBDD;
  --k1:#E2622B; --k2:#1597A0; --k3:#9050C8; --k4:#C23F7A;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,-apple-system,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --s1:14px; --s2:17px; --s3:22px; --s4:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111726; --grid:rgba(160,190,230,.05); --paper:#1A2234; --paper2:#141B2B;
    --ink:#E8EEF7; --muted:#9DABC2; --line:#2D3A54; --scrim:rgba(0,0,0,.65);
    --sun:#F5BC2E; --sun-ink:#2A2000; --on-color:#FFFFFF;
    --c-hoc:#6FA0F0; --t-hoc:#1C2C4A;
    --c-hocthem:#A98BEB; --t-hocthem:#2A2347;
    --c-kiemtra:#F07A6C; --t-kiemtra:#3F2124;
    --c-nghi:#5CC88E; --t-nghi:#183A2A;
    --c-viec:#F0B04A; --t-viec:#3A2D14;
    --c-nhac:#4CC3D0; --t-nhac:#123940;
    --c-tuhoc:#E873C0; --t-tuhoc:#3F1D35;
    --c-choi:#A3D55B; --t-choi:#26361A; --c-sinhhoat:#A8B7D6; --t-sinhhoat:#232B3D;
    --c-sn:#F783AC; --t-sn:#3F1D2B; --c-le:#FB923C; --t-le:#3F2412;
    --k1:#F08A5A; --k2:#3FC1C9; --k3:#B585E6; --k4:#E46FA3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111726; --grid:rgba(160,190,230,.05); --paper:#1A2234; --paper2:#141B2B;
  --ink:#E8EEF7; --muted:#9DABC2; --line:#2D3A54; --scrim:rgba(0,0,0,.65);
  --sun:#F5BC2E; --sun-ink:#2A2000; --on-color:#FFFFFF;
  --c-hoc:#6FA0F0; --t-hoc:#1C2C4A;
  --c-hocthem:#A98BEB; --t-hocthem:#2A2347;
  --c-kiemtra:#F07A6C; --t-kiemtra:#3F2124;
  --c-nghi:#5CC88E; --t-nghi:#183A2A;
  --c-viec:#F0B04A; --t-viec:#3A2D14;
  --c-nhac:#4CC3D0; --t-nhac:#123940;
    --c-tuhoc:#E873C0; --t-tuhoc:#3F1D35;
    --c-choi:#A3D55B; --t-choi:#26361A; --c-sinhhoat:#A8B7D6; --t-sinhhoat:#232B3D;
    --c-sn:#F783AC; --t-sn:#3F1D2B; --c-le:#FB923C; --t-le:#3F2412;
  --k1:#F08A5A; --k2:#3FC1C9; --k3:#B585E6; --k4:#E46FA3;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:var(--f-body); font-size:var(--s2); line-height:1.45;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Đầu trang */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.01em}
.clock{font-family:var(--f-display);font-weight:700;font-size:var(--s3);color:var(--muted);font-variant-numeric:tabular-nums}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who button{min-height:48px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:600;font-size:var(--s2);display:inline-flex;align-items:center;gap:8px}
.who button .dot{width:12px;height:12px;border-radius:50%;background:var(--kc,var(--ink))}
.who button[aria-pressed="true"]{background:var(--kc,var(--ink));border-color:var(--kc,var(--ink));color:var(--on-color)}
.who button[aria-pressed="true"]:not([style]){color:var(--paper)}
.who button[aria-pressed="true"] .dot{background:var(--on-color)}

/* Nội dung */
.main{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:18px}
.sample-note{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:var(--s1);color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.hero .dow{font-family:var(--f-display);font-weight:800;font-size:var(--s4);line-height:1}
.hero .date{font-family:var(--f-display);font-weight:600;font-size:var(--s3);color:var(--muted);font-variant-numeric:tabular-nums}
.off-banner{display:flex;align-items:center;gap:14px;background:var(--t-nghi);border:2px solid var(--c-nghi);border-radius:16px;padding:14px 16px;font-size:var(--s3);font-weight:700;color:var(--ink)}
.off-banner .e{font-size:40px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.sec-head h2{font-size:26px;font-weight:700}
.prog{font-weight:600;color:var(--muted)}
.prog b{color:var(--ink)}
.stars{color:var(--sun);letter-spacing:2px;font-size:20px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}

.t-hoc{--c:var(--c-hoc);--t:var(--t-hoc)}
.t-hocthem{--c:var(--c-hocthem);--t:var(--t-hocthem)}
.t-kiemtra{--c:var(--c-kiemtra);--t:var(--t-kiemtra)}
.t-nghi{--c:var(--c-nghi);--t:var(--t-nghi)}
.t-viec{--c:var(--c-viec);--t:var(--t-viec)}
.t-nhac{--c:var(--c-nhac);--t:var(--t-nhac)}
.t-tuhoc{--c:var(--c-tuhoc);--t:var(--t-tuhoc)}
.t-choi{--c:var(--c-choi);--t:var(--t-choi)}
.t-sinhhoat{--c:var(--c-sinhhoat);--t:var(--t-sinhhoat)}
.t-sinhnhat{--c:var(--c-sn);--t:var(--t-sn)}
.t-le{--c:var(--c-le);--t:var(--t-le)}

.item{display:grid;grid-template-columns:66px 56px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:12px 14px}
.item .time{font-family:var(--f-display);font-weight:700;font-size:var(--s3);color:var(--c);font-variant-numeric:tabular-nums;line-height:1.1}
.item .ico{width:56px;height:56px;border-radius:50%;background:var(--t);display:flex;align-items:center;justify-content:center;font-size:32px}
.item .title{font-size:21px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:var(--s1);color:var(--muted)}
.tag{font-weight:700;color:var(--c);letter-spacing:.02em}
.who-c{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.who-c::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--kc,var(--muted))}
.tick{width:56px;height:56px;border-radius:14px;border:3px solid var(--c);background:var(--paper);font-size:30px;font-weight:800;color:var(--on-color);display:flex;align-items:center;justify-content:center}
.is-done .tick{background:var(--c)}
.is-done .title,.is-done .m-title{text-decoration:line-through;color:var(--muted)}
.is-done .ico{opacity:.55}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--t);border:2px solid var(--c);border-radius:14px;padding:10px 14px}
.alert .a-ico{font-size:34px;text-align:center}
.alert b{font-size:19px}
.count{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);white-space:nowrap}

.tt-today{display:flex;flex-direction:column;gap:12px}
.tt-row h3{font-size:20px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.tt-row h3 .dot{width:12px;height:12px;border-radius:50%;background:var(--kc)}
.subjs{display:flex;flex-wrap:wrap;gap:8px}
.subj{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:8px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;font-size:15px;font-weight:600;text-align:center;line-height:1.2}
.subj .e{font-size:30px;line-height:1.1}
.subj .n{font-size:12px;color:var(--muted);font-weight:600}

/* Tuần */
.week-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.week-nav .range{font-family:var(--f-display);font-weight:700;font-size:var(--s3);margin-right:auto;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.day{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 12px 8px;min-width:0}
.day.is-today{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.day-h h3{font-size:21px;font-weight:700}
.day-h .d{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.day .today-badge{background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:0 10px;font-size:13px;font-weight:700}
.mini{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.mini .m-ico{font-size:24px;text-align:center}
.mini .m-time{font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;margin-right:4px}
.mini .m-title{font-weight:600;overflow-wrap:anywhere}
.mini .m-who{display:block;font-size:13px;color:var(--muted)}
.mini .tick{width:44px;height:44px;border-radius:12px;font-size:24px}
.day .none{color:var(--muted);font-size:var(--s1);padding:6px 0;border-top:1px dashed var(--line)}

/* Thời khoá biểu */
.tkb{display:flex;flex-direction:column;gap:22px}
.tkb h2{font-size:26px;display:flex;align-items:center;gap:10px}
.tkb h2 .dot{width:14px;height:14px;border-radius:50%;background:var(--kc)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tt{border-collapse:separate;border-spacing:6px;min-width:560px;width:100%}
table.tt th{font-family:var(--f-display);font-size:19px;font-weight:700;padding:6px;border-radius:10px;background:var(--paper2);border:2px solid var(--line)}
table.tt th.is-today{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
table.tt td{padding:0;vertical-align:top}
table.tt td .subj{width:100%;min-width:0}
table.tt td.is-today .subj{border-color:var(--sun)}
.hint{color:var(--muted);font-size:var(--s1)}

/* Sắp tới */
.soon{display:flex;flex-direction:column;gap:10px}
.up{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:center;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:12px 14px}
.up .cd{text-align:center;font-family:var(--f-display);color:var(--c);line-height:1}
.up .cd .n{display:block;font-size:42px;font-weight:800}
.up .cd .u{font-size:15px;font-weight:700}
.up .cd .w{font-size:22px;font-weight:800}
.up .title{font-size:20px;font-weight:700;overflow-wrap:anywhere}

/* Bố mẹ */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:600;font-size:var(--s2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.big{min-height:56px;font-size:19px;padding:0 24px}
.btn.danger{border-color:var(--c-kiemtra);color:var(--c-kiemtra)}
.btn.danger.armed{background:var(--c-kiemtra);color:var(--on-color)}
.btn.ghost{border-color:var(--line)}
.p-item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.p-item .e{font-size:28px;text-align:center}
.p-item b{overflow-wrap:anywhere}
.p-group h3{font-size:19px;margin-top:6px;color:var(--c)}
.fld{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
.fld input,.fld select,.fld textarea,.inp{font-size:17px;min-height:48px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper2);color:var(--ink);width:100%;font-weight:400}
.fld textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.pick span{display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper2);font-size:28px}
.pick input:checked + span{border-color:var(--ink);background:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper2);font-weight:600}
.chips input:checked + span{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:var(--on-color)}
.chips input:focus-visible + span,.pick input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.err{color:var(--c-kiemtra);font-weight:700;margin:0}
.err:empty{display:none}
.tt-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

/* Thanh tab đáy */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--paper);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding-block:6px}
.tabs button{min-height:64px;border:0;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600;color:var(--muted);line-height:1.15;text-align:center;padding:4px 2px}
.tabs button .e{font-size:26px;line-height:1}
.tabs button[aria-current="page"]{background:var(--sun);color:var(--sun-ink)}

/* Hộp thoại & chuông */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:20px;width:100%;max-width:660px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:28px}
.alarm{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.alarm-card{background:var(--paper);border:6px solid var(--c);border-radius:24px;padding:28px 24px;max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.alarm-card .e{font-size:84px;line-height:1}
.alarm-card .when{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--c)}
.alarm-card .what{font-size:28px;font-weight:700}
.alarm-card .btn{margin-top:10px;min-width:220px}
.ring{animation:ring 1s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.ring{animation:none}}

/* Sao thưởng, ngày lễ */
.fest-banner{display:flex;align-items:center;gap:14px;background:var(--t);border:2px solid var(--c);border-radius:16px;padding:12px 16px;font-size:var(--s3);font-weight:700}
.fest-banner .e{font-size:36px}
.btn:disabled{opacity:.4;cursor:default}
.kid-stars .ks-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kid-stars h2{display:flex;align-items:center;gap:10px}
.kid-stars h2 .dot{width:14px;height:14px;border-radius:50%;background:var(--kc)}
.ks-bal{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.ks-bal b{font-size:60px;color:var(--kc);font-variant-numeric:tabular-nums}
.ks-h{font-size:20px;margin-top:6px}
.ms{padding:6px 4px 0}
.ms-track{position:relative;height:18px;border-radius:999px;background:var(--paper2);border:2px solid var(--line);margin:12px 14px 0}
.ms-track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--kc)}
.ms-pin{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--paper);border:3px solid var(--line)}
.ms-pin.on{background:var(--kc);border-color:var(--kc)}
.ms-lab{position:relative;height:30px;margin:6px 14px 0;font-weight:800;font-size:18px}
.ms-lab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ms-lab span:last-child{transform:translateX(-85%)}

var storageOk=true;
function load(){
  try{
    var raw=localStorage.getItem(KEY); if(!raw) return null;
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.items)||!Array.isArray(s.kids)) return null;
    if((s.sample===true||s.seedVer>=2)&&(s.seedVer||0)<SEED_VER&&!s.edited){ // lịch gốc cũ, chưa ai sửa -> nhận lịch mới, giữ dấu tích và mã
      var f=sample(); f.done=s.done; f.seen=s.seen; f.pin=s.pin; f.rewards=Array.isArray(s.rewards)?s.rewards:f.rewards; f.redeems=s.redeems||[]; f.log=s.log||[]; return f;
    }
    s.done=s.done||{}; s.seen=s.seen||{}; s.tt=s.tt||{}; s.pin=s.pin||'1234';
    s.rewards=[]; s.redeems=s.redeems||[]; s.log=s.log||[];
    s.rewards.forEach(function(r){r.name=String(r.name).replace(/\s*\(ví dụ, chị sửa lại\)/,'')});
    return s;
  }catch(e){console.warn('Không đọc được dữ liệu đã lưu',e);return null}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}
  catch(e){console.warn(e);if(storageOk){storageOk=false;toast('Máy này không cho lưu dữ liệu, lịch sẽ mất khi tải lại trang.')}}
}
function prune(){ // dấu tích giữ 400 ngày (để tính sao các tháng trước), dấu đã nhắc giữ 60 ngày
  var cuts={done:ymd(addDays(today0(),-400)),seen:ymd(addDays(today0(),-60))};
  ['done','seen'].forEach(function(k){Object.keys(state[k]).forEach(function(key){var d=key.split('|')[1];if(!d||d<cuts[k])delete state[k][key]})});
}

/* ====== Lọc lịch ====== */
function kidIdx(id){for(var i=0;i<state.kids.length;i++)if(state.kids[i].id===id)return i;return -1}
function kidColor(id){var i=kidIdx(id);return 'var(--k'+(i<0?1:i+1)+')'}
function kidName(id){var i=kidIdx(id);return i<0?'?':state.kids[i].name}
function matchWho(it,w){if(w==='all')return true;return it.who.indexOf('all')>=0||it.who.indexOf(w)>=0}
function occursOn(it,d){
  var s=ymd(d);
  if(it.repeat==='weekly'){ if(it.from&&s<it.from) return false; return it.days.indexOf(wd(d))>=0; }
  if(it.repeat==='yearly') return !!it.md&&s.slice(5)===it.md;
  if(!it.date) return false;
  return s>=it.date && s<=(it.end||it.date);
}
function covers(offWho,itWho){
  if(offWho.indexOf('all')>=0) return true;
  if(itWho.indexOf('all')>=0) return false;
  return itWho.every(function(k){return offWho.indexOf(k)>=0});
}
function sortKey(it){return (it.type==='nghi'?'0':!it.time?'1':'2'+it.time)}
function itemsOn(d,w){
  if(w===undefined) w=who;
  var list=state.items.filter(function(it){return occursOn(it,d)&&matchWho(it,w)});
  var offs=list.filter(function(it){return it.type==='nghi'});
  if(offs.length){
    list=list.filter(function(it){ if(it.type!=='hoc'&&it.type!=='tuhoc') return true; return !offs.some(function(o){return covers(o.who,it.who)}) });
  }
  return list.sort(function(a,b){var x=sortKey(a),y=sortKey(b);return x<y?-1:x>y?1:0});
}
function isOffFor(d,kid){
  return state.items.some(function(it){return it.type==='nghi'&&occursOn(it,d)&&(it.who.indexOf('all')>=0||it.who.indexOf(kid)>=0)});
}
function canTick(it){return it.type==='viec'||it.type==='nhac'||it.type==='tuhoc'||it.type==='sinhhoat'}
function startLabel(it){return it.type==='choi'?'▶ Bắt đầu giờ chơi':'▶ Bắt đầu tự học'}
function upcoming(from,to,types){
  var t=today0(), a=ymd(addDays(t,from)), b=ymd(addDays(t,to)), ts=ymd(t), res=[];
  state.items.forEach(function(it){
    if(!matchWho(it,who)||(types&&types.indexOf(it.type)<0)) return;
    if(it.repeat==='once'&&it.date){
      if((it.end||it.date)>=a&&it.date<=b) res.push({it:it,n:daysBetween(t,parseYmd(it.date)),ongoing:it.date<ts});
    }else if(it.repeat==='yearly'&&it.md){ // lần tới của ngày lặp hằng năm
      var nd=parseYmd(t.getFullYear()+'-'+it.md); if(nd<t) nd=parseYmd((t.getFullYear()+1)+'-'+it.md);
      var ds=ymd(nd);
      if(ds>=a&&ds<=b){var c={};for(var k in it)c[k]=it[k];c.date=ds;c.end='';res.push({it:c,n:daysBetween(t,nd),ongoing:false})}
    }
  });
  return res.sort(function(x,y){return x.it.date<y.it.date?-1:x.it.date>y.it.date?1:(x.it.time||'').localeCompare(y.it.time||'')});
}
function countTxt(u){return u.ongoing?'Đang diễn ra':u.n===0?'Hôm nay':u.n===1?'Ngày mai':'Còn '+u.n+' ngày'}

function miniRow(it,d){

var DEF_STARS={tuhoc:3,sinhhoat:1,viec:1,nhac:0}; // số sao mặc định theo loại việc; sửa từng việc trong mục Bố mẹ
var starOff=0; // 0 = tháng này, -1 = tháng trước...
var MILESTONES=[100,200,300]; // 3 chặng sao mỗi tháng
function defaultRewards(){return []}
function starsOf(it){return it.stars!=null?it.stars:(DEF_STARS[it.type]||0)}
function monthKeyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function kidHas(it,kid){return it.who.indexOf('all')>=0||it.who.indexOf(kid)>=0}
function starEntries(kid,mk){
  var out=[];
  Object.keys(state.done).forEach(function(key){
    if(!state.done[key]) return;
    var p=key.split('|'), ds=p[1];
    if(!ds||ds.slice(0,7)!==mk) return;
    var it=null; for(var i=0;i<state.items.length;i++){if(state.items[i].id===p[0]){it=state.items[i];break}}
    if(!it||!kidHas(it,kid)) return;
    var n=starsOf(it); if(n>0) out.push({date:ds,title:it.title,icon:it.icon,n:n});
  });
  (state.log||[]).forEach(function(l){if(l.kid===kid&&l.date.slice(0,7)===mk) out.push({date:l.date,title:l.text,icon:'✍️',n:l.n,id:l.id,manual:true})});
  return out;
}
function spentIn(kid,mk){return (state.redeems||[]).filter(function(r){return r.kid===kid&&r.date.slice(0,7)===mk}).reduce(function(a,r){return a+r.cost},0)}
function vStars(){
  var t=today0(), md=new Date(t.getFullYear(),t.getMonth()+starOff,1), mk=monthKeyOf(md), cur=starOff===0;
  var h='<div class="week-nav"><span class="range">Sao tháng '+(md.getMonth()+1)+'/'+md.getFullYear()+'</span><button class="btn ghost" data-act="star-m" data-n="-1">‹ Tháng trước</button>'+(cur?'':'<button class="btn ghost" data-act="star-m" data-n="0">Tháng này</button>')+'<button class="btn ghost" data-act="star-m" data-n="1"'+(cur?' disabled':'')+'>Tháng sau ›</button></div>';
  var anyOk=false;
  kidsShown().forEach(function(k){
    var ent=starEntries(k.id,mk), earned=ent.reduce(function(a,x){return a+x.n},0), spent=spentIn(k.id,mk), bal=earned-spent;
    var red=(state.redeems||[]).filter(function(r){return r.kid===k.id&&r.date.slice(0,7)===mk}).map(function(r){return {date:r.date,title:'Đổi mốc '+r.cost+' sao',icon:'🏁',n:-r.cost}});
    var rows=ent.concat(red).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
    h+='<section class="panel kid-stars" style="--kc:'+kidColor(k.id)+'"><div class="ks-head"><h2><span class="dot"></span>'+esc(k.name)+'</h2><div class="ks-bal"><b>'+bal+'</b> ⭐</div></div>';
    h+='<p class="hint">Đã kiếm '+earned+' sao'+(spent?', đã đổi '+spent+' sao':'')+' trong tháng. Sao tính riêng từng tháng.</p>';
    var top=MILESTONES[MILESTONES.length-1], pct=Math.max(0,Math.min(100,bal/top*100));
    h+='<div class="ms"><div class="ms-track"><i style="width:'+pct+'%"></i>'+MILESTONES.map(function(m){var on=bal>=m;if(on&&cur)anyOk=true;return '<span class="ms-pin'+(on?' on':'')+'" style="left:'+(m/top*100)+'%"></span>'}).join('')+'</div>'+
      '<div class="ms-lab">'+MILESTONES.map(function(m){return '<span style="left:'+(m/top*100)+'%">'+m+' ⭐'+(bal>=m?' ✓':'')+'</span>'}).join('')+'</div>'+
      '<p class="hint">'+(bal>=top?'Đã đến chặng cuối!':'Còn '+(MILESTONES.filter(function(m){return m>bal})[0]-bal)+' sao nữa đến chặng tiếp theo.')+'</p>'+
      (cur&&parent?'<div class="row">'+MILESTONES.filter(function(m){return bal>=m}).map(function(m){return '<button class="btn primary" data-act="redeem" data-kid="'+k.id+'" data-cost="'+m+'">Đổi '+m+' sao</button>'}).join('')+'</div>':'')+'</div>';
    h+='<h3 class="ks-h">Việc đã làm trong tháng</h3>';
    h+=rows.length?'<div>'+rows.slice(0,20).map(function(x){
      return '<div class="srow"><span class="d">'+shortDate(parseYmd(x.date))+'</span><span aria-hidden="true">'+esc(x.icon)+'</span><span class="t">'+esc(x.title)+'</span><span class="n'+(x.n<0?' neg':'')+'">'+(x.n>0?'+':'')+x.n+' ⭐</span>'+(x.manual&&parent?'<button class="btn ghost" data-act="log-del" data-id="'+x.id+'">Xoá</button>':'<span></span>')+'</div>';
    }).join('')+(rows.length>20?'<p class="hint">Hiện 20 mục gần nhất.</p>':'')+'</div>':'<p class="empty">Chưa có sao nào. Bé bấm ô ✓ trong mục Hôm nay khi làm xong việc.</p>';
    h+='</section>';
  });
  if(anyOk&&!parent) h+='<p class="hint">Đã đến chặng sao rồi. Nhờ bố mẹ vào mục Bố mẹ để đổi.</p>';
  if(parent){
    h+='<section class="panel"><h2>Ghi thêm việc bé đã làm</h2><form id="logForm" novalidate class="panel" style="border:0;padding:0"><div class="grid2">'+
      '<label class="fld"><span>Bé</span><select id="log-kid">'+state.kids.map(function(k){return '<option value="'+k.id+'">'+esc(k.name)+'</option>'}).join('')+'</select></label>'+
      '<label class="fld"><span>Số sao</span><select id="log-n">'+[1,2,3,4,5].map(function(n){return '<option value="'+n+'">'+n+' sao</option>'}).join('')+'</select></label></div>'+
      '<label class="fld"><span>Việc đã làm</span><input id="log-text" maxlength="60" placeholder="Ví dụ: Phụ mẹ rửa bát"></label>'+
      '<label class="fld"><span>Ngày</span><input id="log-date" type="date" value="'+ymd(t)+'"></label>'+
      '<p class="err" id="log-err" role="alert"></p><div class="row"><button class="btn primary" type="submit">Ghi và cộng sao</button></div></form></section>';
    h+='<section class="panel"><h2>Cách tính sao</h2><p class="hint">Số sao của mỗi việc đặt khi sửa việc đó (mặc định: tự học 3 sao, sinh hoạt và việc cần làm 1 sao, nhắc nhở 0 sao). Ba chặng mỗi tháng: 100, 200 và 300 sao.</p></section>';
  } else h+='<p class="hint">Bố mẹ vào mục Bố mẹ (nhập mã) để ghi thêm việc và đổi sao.</p>';
  return h;
}

  if(!whoV.length){err.textContent='Chọn ít nhất một người (hoặc Cả nhà).';return}
  if(repeat==='weekly'&&!days.length){err.textContent='Chọn ít nhất một ngày trong tuần.';return}
  if((repeat==='once'||repeat==='yearly')&&!date){err.textContent='Chọn ngày cho việc này.';return}
  if(repeat==='once'&&end&&end<date){err.textContent='Ngày kết thúc phải sau ngày bắt đầu.';return}
  if(rem!==''&&!time){err.textContent='Muốn nhắc nhở thì cần chọn giờ.';return}
  var it={id:editId||uid(),title:title,icon:icon,type:type,who:whoV.indexOf('all')>=0?['all']:whoV,repeat:repeat,
    days:repeat==='weekly'?days.sort():[],date:repeat==='once'?date:'',md:repeat==='yearly'?date.slice(5):'',end:repeat==='once'&&end&&end!==date?end:'',
    time:time,remind:rem===''?null:Number(rem),note:note};
  var sv=$('#f-stars').value; if(sv!=='') it.stars=Number(sv);
  var oldIt=editId?state.items.filter(function(x){return x.id===editId})[0]:null;
  if(oldIt){if(oldIt.plan)it.plan=oldIt.plan;if(oldIt.from)it.from=oldIt.from}
  if(editId){state.items=state.items.map(function(x){return x.id===editId?it:x})}
  else state.items.push(it);
  state.edited=true; save(); closeForm(); render(); toast(editId?'Đã lưu thay đổi':'Đã thêm “'+title+'”');
}

/* ====== Nhắc nhở khi app đang mở ====== */
var audioCtx=null;
function unlockAudio(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(C&&!audioCtx){audioCtx=new C();var b=audioCtx.createBuffer(1,1,22050),s=audioCtx.createBufferSource();s.buffer=b;s.connect(audioCtx.destination);s.start(0)}
    if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){console.warn('Không bật được âm thanh',e)}
}
function chime(){
  if(!audioCtx) return;
  try{
    var t0=audioCtx.currentTime;
    [660,880,990,880,990].forEach(function(f,i){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=t0+i*0.22;
      o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.32);
    });
  }catch(e){console.warn(e)}
}
var alarmKey=null;
function checkReminders(){
  if(alarmKey||S) return;
  var d=today0(), now=Date.now(), ds=ymd(d);
  var list=itemsOn(d,'all');
  for(var i=0;i<list.length;i++){
    var it=list[i];
    if(it.remind==null||!it.time) continue;
    var key=it.id+'|'+ds;
    if(state.seen[key]||state.done[key]) continue;
    var p=it.time.split(':'), at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]).getTime();
    if(now>=at-it.remind*60000 && now<=at+10*60000){showAlarm(it,key,at,now);return}
  }
}
function showAlarm(it,key,at,now){
  alarmKey=key;
  var mins=Math.ceil((at-now)/60000);
  var when=mins>0?'Còn '+mins+' phút nữa':'Đến giờ rồi!';
  var a=$('#alarm');
  a.innerHTML='<div class="alarm-card t-'+it.type+'" role="alertdialog" aria-labelledby="al-what"><div class="e ring" aria-hidden="true">'+esc(it.icon)+'</div><div class="when">'+when+'</div><div class="what" id="al-what">'+esc(it.title)+'</div><div class="meta" style="justify-content:center;font-size:17px"><span>'+fmtTime(it.time)+'</span>'+whoChips(it.who)+'</div>'+(it.plan?'<button class="btn primary big" data-act="alarm-start" data-id="'+it.id+'">'+startLabel(it)+'</button>':'')+'<button class="btn big'+(it.plan?'':' primary')+'" data-act="alarm-ok">Con biết rồi</button></div>';
  a.hidden=false; chime();
}

/* ====== Giờ tự học: hẹn giờ từng bước ====== */
var S=null; // phiên tự học đang mở
var KIND={play:{ico:'🎈',cls:'b-play'},flash:{ico:'🃏',cls:'b-flash'},work:{ico:'📝',cls:'b-work'},rest:{ico:'💧',cls:'b-rest'}};
function mmss(ms){var t=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(t/60))+':'+pad(t%60)}
function openStudy(id){
  var it=state.items.filter(function(x){return x.id===id})[0];
  if(!it||!it.plan||!it.plan.length) return;
  unlockAudio();
  S={id:id,title:it.title,date:ymd(today0()),stars:starsOf(it),blocks:it.plan.map(function(b){return {k:b.k,t:b.t,ms:b.m*60000}}),i:0,running:false,started:false,endAt:0,remain:it.plan[0].m*60000,finished:false,wake:null};
  renderStudy();
}
function renderStudy(){
  var el=$('#study');
  if(!S){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;
  if(S.finished){
    var pl=S.blocks[S.blocks.length-1].k==='play';
    el.innerHTML='<div class="st-in"><div class="st-end"><div class="e" aria-hidden="true">'+(pl?'⏰':'🎉')+'</div><h2>'+(pl?'Hết giờ chơi rồi!':'Xong rồi, giỏi quá!')+'</h2>'+(!pl&&S.stars>0?'<div class="st-star">+'+S.stars+' ⭐</div>':'')+'<p>'+(pl?'Cất đồ chơi, rửa tay rồi làm việc tiếp theo nhé.':'Con đã học xong buổi này. Cất sách vở, uống nước rồi nghỉ ngơi nhé.')+'</p><button class="btn primary big" data-act="st-close">Đóng</button></div></div>';
    return;
  }
  var b=S.blocks[S.i], K=KIND[b.k]||KIND.work, h='<div class="st-in">';
  h+='<div class="st-top"><b>'+esc(S.title)+'</b><button class="btn ghost" data-act="st-close">Đóng</button></div>';
  h+='<div class="st-now '+K.cls+'"><div class="st-ico" aria-hidden="true">'+K.ico+'</div><div class="st-label">'+esc(b.t)+'</div>'+
     (b.k==='rest'?'<div class="st-hint">Uống nước, đứng dậy đi lại, nhìn ra xa cho mắt nghỉ.</div>':'')+
     '<div class="st-count" id="stCount">'+mmss(S.running?S.endAt-Date.now():S.remain)+'</div><div class="st-bar"><i id="stBar"></i></div><div class="st-eta" id="stEta"></div></div>';
  h+='<div class="row st-btns"><button class="btn primary big" data-act="st-toggle">'+(S.running?'⏸ Tạm dừng':(S.started?'▶ Tiếp tục':'▶ Bắt đầu'))+'</button><button class="btn big" data-act="st-skip">Bước tiếp ›</button></div>';
  h+='<ol class="st-list">'+S.blocks.map(function(x,j){var k=KIND[x.k]||KIND.work;return '<li class="'+k.cls+(j<S.i?' done':'')+(j===S.i?' cur':'')+'"><span class="n" aria-hidden="true">'+(j<S.i?'✓':k.ico)+'</span><span>'+esc(x.t)+'</span><span class="m">'+Math.round(x.ms/60000)+' phút</span></li>'}).join('')+'</ol></div>';
  el.innerHTML=h;
  studyTick();
}
function studyTick(){
  if(!S||S.finished) return;
  var now=Date.now(), changed=false;
  if(S.running){
    while(now>=S.endAt){ // máy ngủ quên cũng tính bù đúng giờ
      var prev=S.endAt; S.i++; changed=true;
      if(S.i>=S.blocks.length){finishStudy();return}
      S.endAt=prev+S.blocks[S.i].ms;
    }
  }
  if(changed){chime();renderStudy();return}
  var remain=S.running?S.endAt-now:S.remain, total=S.blocks[S.i].ms;
  var c=$('#stCount'); if(c) c.textContent=mmss(remain);
  var bar=$('#stBar'); if(bar) bar.style.width=Math.min(100,Math.max(0,(1-remain/total)*100))+'%';
  var eta=$('#stEta');
  if(eta){var rest=remain;for(var j=S.i+1;j<S.blocks.length;j++)rest+=S.blocks[j].ms;var e=new Date(now+rest);eta.textContent='Cả buổi dự kiến xong lúc '+e.getHours()+':'+pad(e.getMinutes())+(S.running?'':' (nếu bắt đầu ngay)')}
}
function finishStudy(){
  S.finished=true; S.running=false; chime();
  state.done[S.id+'|'+S.date]=true; save();
  renderStudy(); render();
}
function studyToggle(){
  if(!S||S.finished) return;
  unlockAudio();
  if(S.running){S.remain=Math.max(0,S.endAt-Date.now());S.running=false}
  else{
    S.running=true;S.started=true;S.endAt=Date.now()+S.remain;
    try{if(navigator.wakeLock&&!S.wake)navigator.wakeLock.request('screen').then(function(l){S.wake=l}).catch(function(){})}catch(e){}
  }
  renderStudy();
}
function studySkip(){
  if(!S||S.finished) return;
  S.i++;
  if(S.i>=S.blocks.length){finishStudy();return}
  S.remain=S.blocks[S.i].ms; if(S.running) S.endAt=Date.now()+S.remain;
  renderStudy();
}
function closeStudy(){
  try{if(S&&S.wake)S.wake.release()}catch(e){}
  S=null; renderStudy(); setTimeout(checkReminders,500);
}
setInterval(studyTick,250);

/* ====== Đồng hồ & đổi ngày ====== */
var lastDay=ymd(today0());
function tickClock(){var n=new Date();$('#clock').textContent=n.getHours()+':'+pad(n.getMinutes())}
setInterval(function(){
  tickClock();
  var d=ymd(today0());
  if(d!==lastDay){lastDay=d;if(!$('#modal').hidden)return;render()}
  checkReminders();
},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){studyTick();var d=ymd(today0());if(d!==lastDay){lastDay=d;render()}checkReminders()}});

/* ====== Xử lý bấm ====== */
var armedTimer=null;
function arm(btn,label,fn){
  if(btn.classList.contains('armed')){clearTimeout(armedTimer);fn();return}
  var old=btn.textContent; btn.classList.add('armed'); btn.textContent=label;
  armedTimer=setTimeout(function(){btn.classList.remove('armed');btn.textContent=old},4000);
}
document.addEventListener('touchstart',unlockAudio,{passive:true});
document.addEventListener('click',function(ev){
  unlockAudio();
  var b=ev.target.closest('[data-act]'); if(!b) return;
  var act=b.getAttribute('data-act');
  if(act==='view'){view=b.getAttribute('data-view');if(view==='week')weekOffset=0;render();window.scrollTo(0,0)}
  else if(act==='who'){who=b.getAttribute('data-id');render()}
  else if(act==='tick'){
    var key=b.getAttribute('data-key');
    if(state.done[key]) delete state.done[key]; else state.done[key]=true;
    save(); render();
    if(state.done[key]){
      var tid=key.split('|')[0], tit=state.items.filter(function(x){return x.id===tid})[0], sn=tit?starsOf(tit):0, msg=sn>0?'+'+sn+' ⭐ ':'';
      if(view==='today'){
        var d=today0(), tasks=itemsOn(d).filter(canTick);
        if(tasks.length&&tasks.every(function(it){return state.done[it.id+'|'+ymd(d)]})) msg+='Giỏi quá! Xong hết việc hôm nay 🎉';
      }
      if(msg) toast(msg.trim());
    }
  }
  else if(act==='star-m'){var sm=+b.getAttribute('data-n');starOff=sm===0?0:Math.min(0,starOff+sm);render()}
  else if(act==='redeem'){
    var rk=b.getAttribute('data-kid'), rc=parseInt(b.getAttribute('data-cost'),10);
    arm(b,'Bấm lần nữa để đổi',function(){
      var mk0=monthKeyOf(today0()), bal0=starEntries(rk,mk0).reduce(function(a,x){return a+x.n},0)-spentIn(rk,mk0);
      if(bal0<rc){toast('Chưa đủ sao');render();return}
      state.redeems=state.redeems||[]; state.redeems.push({id:uid(),kid:rk,cost:rc,date:ymd(today0())});
      save();render();toast('Đã đổi '+rc+' sao cho '+kidName(rk));
    });
  }
  else if(act==='log-del'){var lid=b.getAttribute('data-id');arm(b,'Bấm lần nữa để xoá',function(){state.log=(state.log||[]).filter(function(x){return x.id!==lid});save();render();toast('Đã xoá')})}
  else if(act==='wk'){var n=+b.getAttribute('data-n');weekOffset=n===0?0:weekOffset+n;render()}
  else if(act==='add') openForm(null);
  else if(act==='edit') openForm(b.getAttribute('data-id'));
  else if(act==='close') closeForm();
  else if(act==='del') arm(b,'Bấm lần nữa để xoá',function(){var t=editId;state.items=state.items.filter(function(x){return x.id!==t});state.edited=true;save();closeForm();render();toast('Đã xoá')});
  else if(act==='lock'){parent=false;render()}
  else if(act==='clear-sample') arm(b,'Bấm lần nữa: xoá hết mẫu',function(){
    state.items=[];state.tt={};state.done={};state.seen={};state.sample=false;state.edited=true;
    state.kids=[{id:'k1',name:'Bé 1'},{id:'k2',name:'Bé 2'}];
    save();render();toast('Đã xoá lịch mẫu. Giờ chị nhập tên các bé và lịch thật nhé.');
  });
  else if(act==='keep-sample'){state.sample=false;state.edited=true;save();render()}
  else if(act==='add-kid'){
    if(state.kids.length>=MAX_KIDS) return;
    var n=1;while(kidIdx('k'+n)>=0)n++;
    state.kids.push({id:'k'+n,name:'Bé '+(state.kids.length+1)});state.edited=true;save();render();toast('Đã thêm một bé, sửa tên ở phần Gia đình.');
  }
  else if(act==='copy'){
    var txt=JSON.stringify({v:1,pin:state.pin,kids:state.kids,items:state.items,tt:state.tt,rewards:state.rewards,redeems:state.redeems,log:state.log,done:state.done});
    var out=$('#backupOut'); out.value=txt;
    var fallback=function(){out.hidden=false;out.focus();out.select();out.setSelectionRange(0,txt.length);toast('Chữ đã được bôi đen, chị bấm Sao chép nhé.')};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Đã sao chép bản sao lưu')},fallback)}
    else fallback();
  }
  else if(act==='study') openStudy(b.getAttribute('data-id'));
  else if(act==='st-toggle') studyToggle();
  else if(act==='st-skip') studySkip();
  else if(act==='st-close'){ if(!S||!S.started||S.finished) closeStudy(); else arm(b,'Bấm lần nữa để dừng',closeStudy); }
  else if(act==='alarm-start'){
    var sid=b.getAttribute('data-id');
    if(alarmKey){state.seen[alarmKey]=true;save()}
    alarmKey=null;$('#alarm').hidden=true;$('#alarm').innerHTML='';
    openStudy(sid);
  }
  else if(act==='alarm-ok'){
    if(alarmKey){state.seen[alarmKey]=true;save()}
    alarmKey=null; $('#alarm').hidden=true; $('#alarm').innerHTML='';
    setTimeout(checkReminders,500);
  }
});
document.addEventListener('change',function(ev){
  if(ev.target.name==='repeat'){var w=ev.target.value==='weekly';$('#f-weekly').hidden=!w;$('#f-once').hidden=w}
  if(ev.target.name==='type'&&!editId){ // gợi ý hình theo loại khi thêm mới
    var ic=TYPES[ev.target.value].icon, r=document.querySelector('#itemForm input[name="icon"][value="'+ic+'"]'); if(r) r.checked=true;
  }
  if(ev.target.name==='who'&&ev.target.value==='all'&&ev.target.checked){
    Array.prototype.forEach.call(document.querySelectorAll('#itemForm input[name="who"]'),function(i){if(i.value!=='all')i.checked=false});
  } else if(ev.target.name==='who'&&ev.target.checked){
    var all=document.querySelector('#itemForm input[name="who"][value="all"]'); if(all) all.checked=false;
  }
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var id=ev.target.id;
  if(id==='pinForm'){
    if($('#pin').value===state.pin){parent=true;render()}
    else{$('#pinErr').textContent='Mã chưa đúng, thử lại nhé.';$('#pin').value='';$('#pin').focus()}
  }
  else if(id==='itemForm') saveItem();
  else if(id==='logForm'){
    var lk=$('#log-kid').value, lt=$('#log-text').value.trim(), ld=$('#log-date').value, ln=Number($('#log-n').value), lerr=$('#log-err');
    if(!lt){lerr.textContent='Hãy ghi việc bé đã làm.';return}
    if(!ld){lerr.textContent='Hãy chọn ngày.';return}
    state.log=state.log||[]; state.log.push({id:uid(),kid:lk,date:ld,text:lt,n:ln}); save(); render(); toast('Đã cộng '+ln+' sao cho '+kidName(lk));
  }
  else if(id==='ttForm'){
    state.kids.forEach(function(k){
      var t={};
      for(var w=1;w<=5;w++){var el=$('#tt-'+k.id+'-'+w);var arr=el?el.value.split(/[,;\n]/).map(function(s){return s.trim()}).filter(Boolean):[];if(arr.length)t[w]=arr}
      state.tt[k.id]=t;
    });
    state.edited=true;save();toast('Đã lưu thời khoá biểu');
  }
  else if(id==='famForm'){
    var errEl=$('#famErr'), names={};
    for(var i=0;i<state.kids.length;i++){var k=state.kids[i],v=$('#kn-'+k.id).value.trim();if(!v){errEl.textContent='Tên bé thứ '+(i+1)+' đang để trống.';return}names[k.id]=v}
    var np=$('#newPin').value.trim();
    if(np&&!/^\d{4}$/.test(np)){errEl.textContent='Mã mới cần đúng 4 chữ số.';return}
    state.kids.forEach(function(k){k.name=names[k.id]});
    if(np) state.pin=np;
    state.edited=true;save();render();toast(np?'Đã lưu tên và đổi mã bố mẹ':'Đã lưu tên các bé');
  }
  else if(id==='restoreForm'){
    var re=$('#restoreErr'), s;
    try{s=JSON.parse($('#restoreIn').value)}catch(e){re.textContent='Không đọc được bản sao lưu. Hãy dán đúng toàn bộ đoạn chữ đã sao chép.';return}
    if(!s||!Array.isArray(s.items)||!Array.isArray(s.kids)||!s.kids.length){re.textContent='Bản sao lưu thiếu thông tin lịch hoặc tên các bé.';return}
    state={v:1,seedVer:SEED_VER,edited:true,sample:false,pin:/^\d{4}$/.test(s.pin)?s.pin:state.pin,kids:s.kids,items:s.items,tt:s.tt||{},done:s.done||{},seen:{},rewards:Array.isArray(s.rewards)?s.rewards:defaultRewards(),redeems:s.redeems||[],log:s.log||[]};
    save();render();toast('Đã khôi phục '+state.items.length+' mục lịch');
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#modal').hidden)closeForm()});
$('#modal').addEventListener('click',function(ev){if(ev.target.id==='modal')closeForm()});

render();
setTimeout(checkReminders,1500);
})();
</script>
